spring:
  application:
    name: blps

  datasource:
    xa:
      driver-class-name: org.postgresql.xa.PGXADataSource
      #      url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studs}
      username: ${SPRING_DATASOURCE_USERNAME:s367044}
      password: ${SPRING_DATASOURCE_PASSWORD:rkemWfU26OYiwbkD}
      serverName: localhost
      portNumber: 25432 # Вы используете порт 5432 в основном конфиге. Убедитесь, что он правильный.
      databaseName: studs

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        transaction.jta.platform: org.hibernate.engine.transaction.jta.platform.internal.AtomikosJtaPlatform
        order_inserts: true
        order_updates: true
        generate_statistics: true
        jdbc:
          batch_size: 50
          lob:
            non_contextual_creation: true
        format_sql: true
        use_sql_comments: true
        default_schema: public
    hibernate:
      ddl-auto: validate
    show-sql: true

  security:
    jaas:
      enabled: true
      app-name: XmlAuth
    user:
      password:
        encode: false

  activemq:
    broker-url-amqp: amqp://localhost:5672
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

  jms:
    listener:
      acknowledge-mode: auto
      auto-startup: true


quartz:
  job-store-type: jdbc
  jdbc:
    initialize-schema: never
  properties:
    org:
      quartz:
        scheduler:
          instanceName: ClusteredScheduler
        threadPool:
          threadCount: 5
        jobStore:
          class: org.quartz.impl.jdbcjobstore.JobStoreTX
          driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
          isClustered: true

  quartz:
    datasource:
      url: jdbc:postgresql://localhost:25432/studs
      username: s367044
      password: rkemWfU26OYiwbkD
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5

  jta:
    enabled: true
    log-dir: target/atomikos
    transaction-manager-id: myTm


logging:
  level:
    org:
      hibernate:
        SQL: WARN
        type.descriptor.sql.BasicBinder: TRACE
    #        engine.jdbc:
    #          env.internal.LobCreationLogging: DEBUG
    #          connections.internal.ConnectionProviderInitiator: DEBUG
    ticket.management: DEBUG

